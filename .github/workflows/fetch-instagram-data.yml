name: Fetch Instagram Data

on:
  schedule:
    # Bewust niet op het hele uur: geplande runs op :00 worden door GitHub bij
    # drukte vaak vertraagd of overgeslagen. Een "rustige" minuut is veel
    # betrouwbaarder. 06:17 UTC = 08:17 in de zomer (CEST), 07:17 in de winter.
    - cron: '17 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch and update Instagram data
        env:
          ENCRYPTION_PASSPHRASE: ${{ secrets.ENCRYPTION_PASSPHRASE }}
        run: node scripts/fetch-and-update.js

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*/history.enc.json data/*/token.enc.json
          if git diff --cached --quiet; then
            echo "Geen wijzigingen om te committen."
          else
            git commit -m "Dagelijkse Instagram data-update"
            git push
          fi
